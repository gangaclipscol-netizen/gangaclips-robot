# Vigía de GangaClips: cada 15 minutos revisa en Kick si algún streamer terminó un live nuevo (unos 20 s, sin costo en
# un repo público). Arranca un robot "GangaClips en la nube" (gangaclips.yml) por cada streamer con trabajo, en paralelo.
name: Vigía de lives

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # minutos poco congestionados en GitHub
  workflow_dispatch:
    inputs:
      forzar: { description: "arrancar el robot aunque no haya lives nuevos (prueba)", type: boolean, default: false }

concurrency: { group: vigia, cancel-in-progress: false }
permissions: { actions: write, contents: read }

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay lives nuevos?
        id: kick
        run: |
          NUEVOS=$(python3 clips/vigia.py | tr '\n' ' ')
          echo "pendientes: $NUEVOS"
          echo "slugs=$NUEVOS" >> "$GITHUB_OUTPUT"
          echo "hay=$([ -n "${NUEVOS// /}" ] && echo si || echo no)" >> "$GITHUB_OUTPUT"
      - name: Arrancar un robot por streamer (en paralelo)
        if: steps.kick.outputs.hay == 'si' || inputs.forzar
        env:
          GH_TOKEN: ${{ github.token }}
          NUEVOS: ${{ steps.kick.outputs.slugs }}
        run: |
          # cada streamer tiene su propia fila (concurrency en gangaclips.yml): si su robot sigue trabajando, este espera turno
          for s in ${NUEVOS:-westcol}; do gh workflow run gangaclips.yml -R "$GITHUB_REPOSITORY" -f canal="$s" && echo "robot de $s arrancado"; done
