# Clips para campañas de MÚSICA de Quanty (clips/musica.py): Vice City (montajes de GTA VI) y La Botella (video oficial
# con frases POV). Todos los días a la 1 p. m. de Colombia; a mano: Actions → Run workflow.
name: "GangaClips: campañas de música"

on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      campana: { description: "vicecity o todas (La Botella va en el repo privado)", required: false, default: "todas" }
      n: { description: "clips por campaña", required: false, default: "2" }

concurrency: { group: musica, cancel-in-progress: false }

jobs:
  musica:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Programas
        run: |
          for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && break; sleep 60; done
          pip install -q pillow requests faster-whisper "yt-dlp[default]"
      - name: Llave del bot (desde los secretos)
        env:
          TOKEN: ${{ secrets.GANGACLIPS_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.GANGACLIPS_TELEGRAM_CHAT_ID }}
        run: python -c "import json,os,pathlib; pathlib.Path.home().joinpath('.adflow-telegram-gangaclips.json').write_text(json.dumps({'token':os.environ['TOKEN'],'chat_id':int(os.environ['CHAT'])}))"
      - name: Hacer los clips
        working-directory: clips
        env:
          PYTHONIOENCODING: utf-8
          ADFLOW_BOT: gangaclips
          CAMPANA: ${{ inputs.campana || 'todas' }}
          N: ${{ inputs.n || '2' }}
        run: |
          for c in vicecity; do  # La Botella corre en el repo PRIVADO gangaclips-campanas (video oficial con derechos)
            if [ "$CAMPANA" = "todas" ] || [ "$CAMPANA" = "$c" ]; then python musica.py "$c" --n "$N" || echo "falló $c"; fi
          done
      - name: Avisar por Telegram si algo falló
        if: failure()
        env:
          TOKEN: ${{ secrets.GANGACLIPS_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.GANGACLIPS_TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ GangaClips: falló «${{ github.workflow }}». Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Limpiar llaves
        if: always()
        run: rm -f ~/.adflow-telegram-gangaclips.json
