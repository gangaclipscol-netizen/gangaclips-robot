# Banco de caras para las miniaturas (clips/caras.py): de los últimos lives del streamer saca los cuadros donde sale grande,
# nítido y expresivo, los recorta sin fondo y los guarda en clips/caras/<slug>/ (se suben al repo).
# Correr una vez por streamer y repetir de vez en cuando (cambia de corte, de ropa...).
name: "GangaClips: banco de caras"
run-name: "Banco de caras: ${{ inputs.canal }}"

on:
  workflow_dispatch:
    inputs:
      canal: { description: "slug de Kick (westcol, chanty...)", required: true, default: "westcol" }
      lives: { description: "cuántos lives revisar", required: false, default: "4" }

concurrency: { group: "caras-${{ inputs.canal }}", cancel-in-progress: false }
permissions: { contents: write }

jobs:
  caras:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Programas
        run: |
          for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && break; sleep 60; done
          pip install -q pillow requests faster-whisper "rembg[cpu]" opencv-python-headless
      - name: Armar el banco
        working-directory: clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python caras.py --canal "${{ inputs.canal }}" --lives "${{ inputs.lives }}"
      - name: Guardar el banco en el repo
        run: |
          git config user.name "GangaClips (nube)"; git config user.email "actions@users.noreply.github.com"
          git add clips/caras/
          git diff --cached --quiet && exit 0
          git commit -q -m "Banco de caras: ${{ inputs.canal }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
      - name: Avisar por Telegram si algo falló
        if: failure()
        env:
          TOKEN: ${{ secrets.GANGACLIPS_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.GANGACLIPS_TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ GangaClips: falló «${{ github.workflow }}». Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
