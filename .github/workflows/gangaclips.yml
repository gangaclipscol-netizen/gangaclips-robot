# GangaClips (proyecto de Nicolás) en la nube: clips de Westcol y amigos desde Kick, sin usar el PC (3,4 GB de RAM).
# Lo arranca el Vigía de lives (vigia.yml, revisa Kick cada 15 min) cuando un streamer de gangaclips.json lleva 12 min nuevos EN VIVO o termina un live, la IA escoge los mejores
# momentos, arma los clips verticales con subtítulos, publica hasta 6 por corrida (~30 al día; la API de Instagram permite 50) en Instagram @gangaclips.col + página de
# Facebook (API de Meta, subida directa) y manda cada uno al bot de Telegram @gangaclips_bot con ✅/⚠️ por red.
# A mano: pestaña Actions → "GangaClips en la nube" → Run workflow.
# Secretos del repo: GEMINI_API_KEY, GROQ_API_KEY, GANGACLIPS_TELEGRAM_TOKEN, GANGACLIPS_TELEGRAM_CHAT_ID, GANGACLIPS_META_JSON (nunca en el código).
name: GangaClips en la nube
run-name: "GangaClips: ${{ inputs.canal || 'todos' }}"

on:
  workflow_dispatch:
    inputs:
      canal: { description: "slug de Kick (vacío = todos)", required: false, default: "" }
      n: { description: "clips por live (vacío = lo de gangaclips.json)", required: false, default: "" }
      vod: { description: "live (0 = el más reciente; vacío = solo los nuevos)", required: false, default: "" }

concurrency: { group: "gangaclips-${{ inputs.canal || 'todos' }}", cancel-in-progress: false }  # un robot por streamer a la vez; streamers distintos en paralelo
permissions: { contents: write }

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Programas (ffmpeg + fuente Arial Black)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          # 2026-11-11 falló una vez por DNS de los servidores de Ubuntu: reintentar hasta 4 veces
          for i in 1 2 3 4; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg ttf-mscorefonts-installer fontconfig > /dev/null && break
            echo "apt falló (intento $i), reintento en 60 s"; sleep 60
          done
          command -v ffmpeg
          sudo fc-cache -f > /dev/null
          pip install -q pillow requests faster-whisper "yt-dlp[default]"
      - name: Llave del bot (desde los secretos)
        env:
          TOKEN: ${{ secrets.GANGACLIPS_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.GANGACLIPS_TELEGRAM_CHAT_ID }}
          META: ${{ secrets.GANGACLIPS_META_JSON }}
        run: |
          python -c "import json,os,pathlib; pathlib.Path.home().joinpath('.adflow-telegram-gangaclips.json').write_text(json.dumps({'token':os.environ['TOKEN'],'chat_id':int(os.environ['CHAT'])}))"
          [ -n "$META" ] && printf '%s' "$META" > ~/.adflow-meta.json || echo "sin permiso de Meta: solo Telegram"
      - name: Hacer los clips
        working-directory: clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # respaldo cuando Gemini se queda sin cupo
          PYTHONIOENCODING: utf-8
          ADFLOW_CANALES: gangaclips.json
          ADFLOW_ESTADO_DIR: estado
          ADFLOW_BOT: gangaclips
          ADFLOW_IG: gangaclips.col
          ADFLOW_MAX_PUB: "6"
          ADFLOW_SALIDA: ${{ runner.temp }}/clips
          ADFLOW_TMP: ${{ runner.temp }}/clips-tmp
          ADFLOW_FUENTE: /usr/share/fonts/truetype/msttcorefonts/Arial_Black.ttf
          ADFLOW_FONTSDIR: /usr/share/fonts/truetype/msttcorefonts
        run: |
          ARGS=""
          [ -n "${{ inputs.canal }}" ] && ARGS="$ARGS --canal ${{ inputs.canal }}"
          [ -n "${{ inputs.n }}" ] && ARGS="$ARGS --n ${{ inputs.n }}"
          [ -n "${{ inputs.vod }}" ] && ARGS="$ARGS --vod ${{ inputs.vod }}"
          python clips.py $ARGS
      - name: Avisar por Telegram si algo falló
        if: failure()
        env:
          TOKEN: ${{ secrets.GANGACLIPS_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.GANGACLIPS_TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ GangaClips: el robot de hoy FALLÓ. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Guardar qué lives ya se hicieron
        if: always()
        run: |
          rm -f ~/.adflow-telegram-gangaclips.json ~/.adflow-meta.json
          git config user.name "GangaClips (nube)"
          git config user.email "actions@users.noreply.github.com"
          git add clips/estado/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "GangaClips (${{ inputs.canal || 'todos' }}): lives revisados"
          # varios robots suben a la vez (cada uno su archivo): reintentar si otro subió primero
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
